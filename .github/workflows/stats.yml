name: Refresh stat cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/gen_stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG cards
        env:
          # STATS_TOKEN (a PAT with read access) also counts private
          # contributions; without it the numbers are public-only.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "Aaron Kakembo"
          git config user.email "kaaronaire@gmail.com"
          git add assets/stats.svg assets/langs.svg
          git diff --staged --quiet || git commit -m "chore: refresh stat cards"
          git push
