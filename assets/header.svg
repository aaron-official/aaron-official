<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Aaron Kakembo, software engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#060910"/>
      <stop offset="45%"  stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>

    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.42"/>
      <stop offset="45%"  stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="45%"  stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0.34"/>
      <stop offset="50%"  stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7dd3fc"/>
      <stop offset="28%"  stop-color="#f1f6fc"/>
      <stop offset="52%"  stop-color="#ffffff"/>
      <stop offset="74%"  stop-color="#f1f6fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1.1 0; 1.1 0; 1.1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="82%"  stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.05" fill="#8ba3c7" fill-opacity="0.16"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="soft" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="halo" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>

    <!-- typing masks: 18s cycle, three 6s windows -->
    <clipPath id="ty0"><rect x="470" y="196" height="26" width="0">
      <animate attributeName="width" values="0;262;262;0;0" keyTimes="0;0.078;0.310;0.311;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="ty1"><rect x="395" y="196" height="26" width="0">
      <animate attributeName="width" values="0;0;412;412;0;0" keyTimes="0;0.333;0.411;0.643;0.644;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="ty2"><rect x="416" y="196" height="26" width="0">
      <animate attributeName="width" values="0;0;370;370;0;0" keyTimes="0;0.667;0.745;0.977;0.978;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#sky)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- depth: soft drifting light, parallax speeds -->
    <g filter="url(#soft)">
      <ellipse cx="250" cy="80" rx="330" ry="150" fill="url(#g1)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 120 34; 0 0" dur="26s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="980" cy="230" rx="360" ry="160" fill="url(#g2)">
        <animateTransform attributeName="transform" type="translate" values="0 0; -140 -40; 0 0" dur="33s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="620" cy="150" rx="300" ry="120" fill="url(#g3)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 -46; 0 0" dur="41s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- circuit traces -->
    <g fill="none" stroke-width="1.1" opacity="0.5">
      <path d="M0 44 H188 l22 -22 H392" stroke="url(#trace)" stroke-dasharray="70 460">
        <animate attributeName="stroke-dashoffset" values="530;0" dur="6.5s" repeatCount="indefinite"/></path>
      <path d="M1200 258 H1012 l-22 22 H812" stroke="url(#trace)" stroke-dasharray="70 460">
        <animate attributeName="stroke-dashoffset" values="0;530" dur="8s" repeatCount="indefinite"/></path>
      <path d="M0 262 H120 l26 26 H300" stroke="url(#trace)" stroke-dasharray="50 420" opacity="0.6">
        <animate attributeName="stroke-dashoffset" values="470;0" dur="9.5s" repeatCount="indefinite"/></path>
    </g>
    <g stroke="#2b3a55" stroke-width="1" fill="none" opacity="0.45">
      <path d="M0 44 H188 l22 -22 H392"/>
      <path d="M1200 258 H1012 l-22 22 H812"/>
      <path d="M0 262 H120 l26 26 H300"/>
    </g>

    <!-- far particles -->
    <g fill="#9db4d8" opacity="0.45">
      <circle cx="150" cy="238" r="1.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="333" cy="62"  r="1.2"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="7.5s" repeatCount="indefinite"/></circle>
      <circle cx="866" cy="252" r="1.5"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="5.4s" repeatCount="indefinite"/></circle>
      <circle cx="1064" cy="196" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="8.2s" repeatCount="indefinite"/></circle>
      <circle cx="512" cy="42"  r="1.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="6.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- near constellation -->
    <g>
      <g stroke="#5aa2ff" stroke-width="1" opacity="0.34">
        <line x1="96" y1="196" x2="196" y2="132"><animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="7s" repeatCount="indefinite"/></line>
        <line x1="196" y1="132" x2="286" y2="206"><animate attributeName="stroke-opacity" values="0.55;0.08;0.55" dur="9s" repeatCount="indefinite"/></line>
        <line x1="1104" y1="98" x2="1010" y2="152"><animate attributeName="stroke-opacity" values="0.12;0.58;0.12" dur="8s" repeatCount="indefinite"/></line>
        <line x1="1010" y1="152" x2="928" y2="82"><animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="10.5s" repeatCount="indefinite"/></line>
        <animateTransform attributeName="transform" type="translate" values="0 0; 14 -8; 0 0" dur="24s" repeatCount="indefinite"/>
      </g>
      <g filter="url(#spark)">
        <circle cx="96"   cy="196" r="2.6" fill="#60a5fa"><animate attributeName="r" values="2.2;4;2.2" dur="5s" repeatCount="indefinite"/></circle>
        <circle cx="196"  cy="132" r="3"   fill="#a78bfa"><animate attributeName="r" values="3;1.8;3" dur="6.4s" repeatCount="indefinite"/></circle>
        <circle cx="286"  cy="206" r="2.3" fill="#22d3ee"><animate attributeName="r" values="2.3;3.9;2.3" dur="7.1s" repeatCount="indefinite"/></circle>
        <circle cx="1104" cy="98"  r="2.5" fill="#22d3ee"><animate attributeName="r" values="2.5;1.5;2.5" dur="5.7s" repeatCount="indefinite"/></circle>
        <circle cx="1010" cy="152" r="2.9" fill="#60a5fa"><animate attributeName="r" values="2.9;4.4;2.9" dur="6.9s" repeatCount="indefinite"/></circle>
        <circle cx="928"  cy="82"  r="2.2" fill="#a78bfa"><animate attributeName="r" values="2.2;3.6;2.2" dur="8.3s" repeatCount="indefinite"/></circle>
        <animateTransform attributeName="transform" type="translate" values="0 0; 14 -8; 0 0" dur="24s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- name -->
    <g font-family="ui-monospace,SFMono-Regular,'DejaVu Sans Mono',Menlo,monospace" font-size="62" font-weight="700" letter-spacing="11">
      <text x="600" y="132" text-anchor="middle" fill="#1e3a68" opacity="0.55" filter="url(#halo)">AARON KAKEMBO</text>
      <text x="600" y="130" text-anchor="middle" fill="url(#ink)">AARON KAKEMBO</text>
      <text x="600" y="130" text-anchor="middle" fill="url(#sheen)">AARON KAKEMBO</text>
    </g>

    <!-- hairline with travelling node -->
    <g>
      <rect x="300" y="156" width="600" height="1.4" rx="0.7" fill="url(#hair)"/>
      <circle cy="156.7" r="3" fill="#e9d5ff" filter="url(#spark)">
        <animate attributeName="cx" values="310;890;310" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="11s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- typed roles -->
    <g font-family="ui-monospace,SFMono-Regular,'DejaVu Sans Mono',Menlo,monospace" font-size="18">
      <g clip-path="url(#ty0)">
        <text x="470" y="214" fill="#93a7c4"><tspan fill="#22d3ee">$</tspan> multi-agent AI systems</text>
      </g>
      <g clip-path="url(#ty1)">
        <text x="395" y="214" fill="#93a7c4"><tspan fill="#a78bfa">$</tspan> mobile-money payments infrastructure</text>
      </g>
      <g clip-path="url(#ty2)">
        <text x="416" y="214" fill="#93a7c4"><tspan fill="#60a5fa">$</tspan> developer tools and Rust systems</text>
      </g>
      <rect y="198" width="9" height="20" fill="#e6edf3" opacity="0.85">
        <animate attributeName="x"
                 values="470;732;732;395;807;807;416;786;786;470"
                 keyTimes="0;0.078;0.310;0.333;0.411;0.643;0.667;0.745;0.977;1"
                 dur="18s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.9;0;0;0.9;0.9" keyTimes="0;0.48;0.5;0.52;0.54;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- tech pills -->
    <g font-family="ui-monospace,SFMono-Regular,'DejaVu Sans Mono',Menlo,monospace" font-size="13" text-anchor="middle">
      <g>
        <rect x="404" y="242" width="88" height="28" rx="14" fill="#1f6feb" fill-opacity="0.14" stroke="#4493f8" stroke-opacity="0.55"/>
        <text x="448" y="261" fill="#8fc6ff">Python</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="500" y="242" width="112" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.55"/>
        <text x="556" y="261" fill="#cdbcfd">TypeScript</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" begin="1.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="620" y="242" width="72" height="28" rx="14" fill="#f97316" fill-opacity="0.14" stroke="#fb923c" stroke-opacity="0.55"/>
        <text x="656" y="261" fill="#fdc088">Rust</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" begin="2.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="700" y="242" width="96" height="28" rx="14" fill="#06b6d4" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.55"/>
        <text x="748" y="261" fill="#7fe6f5">Next.js</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" begin="3.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- HUD brackets -->
    <g stroke="#7dd3fc" stroke-width="1.6" fill="none" opacity="0.5">
      <path d="M26 58 V32 H52"/><path d="M1174 58 V32 H1148"/>
      <path d="M26 242 V268 H52"/><path d="M1174 242 V268 H1148"/>
      <animate attributeName="opacity" values="0.28;0.7;0.28" dur="6s" repeatCount="indefinite"/>
    </g>

    <rect x="-300" y="0" width="300" height="300" fill="#7dd3fc" opacity="0.035">
      <animate attributeName="x" values="-300;1200" dur="12s" repeatCount="indefinite"/>
    </rect>

    <rect width="1200" height="300" fill="url(#vig)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="16" fill="none" stroke="#233046" stroke-width="1.5"/>
  </g>
</svg>
